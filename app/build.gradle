// Helper to ensure a keystore exists for CI builds (The fix for your signing error)
def ensureKeystore() {
    def keystoreFile = file(System.getProperty("user.home") + "/.android/debug.keystore")
    if (!keystoreFile.exists()) {
        keystoreFile.parentFile.mkdirs()
        exec {
            executable "keytool"
            args "-genkey", "-v", "-keystore", keystoreFile, "-storepass", "android", "-alias", "androiddebugkey", "-keypass", "android", "-keyalg", "RSA", "-keysize", "2048", "-validity", "10000", "-dname", "CN=Android Debug,O=Android,C=US"
        }
    }
    return keystoreFile
}

android {
    namespace 'moe.apex.breadboard'
    compileSdk 36

    signingConfigs {
        debug {
            // Updated to use the helper function
            storeFile ensureKeystore()
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }

    defaultConfig {
        applicationId "moe.apex.breadboard"
        minSdk 26
        targetSdk 36
        versionCode 321
        versionName "3.2.1"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary true
        }

        buildConfigField "String", "R34_APP_ID", properties.getProperty("R34_APP_ID", "\"\"")
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            
            signingConfig signingConfigs.debug
            
            // Map GitHub Secrets (env) or local properties
            buildConfigField "String", "R34_API_KEY", "\"" + (System.getenv("R34_API_KEY") ?: properties.getProperty("R34_API_KEY", "")) + "\""
        }
        debug {
            applicationIdSuffix ".debug"
            buildConfigField "String", "R34_API_KEY", "\"" + (System.getenv("R34_API_KEY_DEBUG") ?: properties.getProperty("R34_API_KEY_DEBUG", "")) + "\""
        }
    }
    
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    
    kotlinOptions {
        jvmTarget = '21'
    }
    
    buildFeatures {
        compose true
        buildConfig true
    }
}

